name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Merakit APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (Dibutuhkan Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2

      - name: 🚀 Build APK dengan Flet
        run: yes | flet build apk . --project "calculate" --product "CALCULATE"

      - name: 📤 Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: PyMobile-Calc-APK
          path: build/apk/*.apk